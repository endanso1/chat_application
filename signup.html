<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Up | Distributed Chat System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="login-page">
    <div
      class="container-fluid min-vh-100 d-flex align-items-center justify-content-center"
    >
      <div class="row w-100 justify-content-center">
        <div class="col-lg-9 col-xl-8">
          <div
            class="card shadow-lg border-0 rounded-4 overflow-hidden fade-slide"
          >
            <div class="row g-0">
              <!-- LEFT PANEL -->
              <div
                class="col-md-6 login-left d-none d-md-flex flex-column justify-content-center text-white p-5"
              >
                <h2 class="fw-bold mb-3">Join the Platform</h2>
                <p class="lead">
                  Create an account to start secure and real-time communication.
                </p>
                <ul class="small mt-4">
                  <li>✔ Secure authentication</li>
                  <li>✔ Group collaboration</li>
                  <li>✔ Private messaging</li>
                  <li>✔ Real-time presence</li>
                </ul>
              </div>

              <!-- RIGHT PANEL -->
              <div class="col-md-6 p-5">
                <h4 class="fw-bold mb-4 text-center">Create Account</h4>

                <div class="mb-3">
                  <label class="form-label">Full Name</label>
                  <input
                    type="text"
                    id="fullName"
                    class="form-control"
                    placeholder="Enter your full name"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" id="dob" class="form-control" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Email Address</label>
                  <input
                    type="email"
                    id="signupEmail"
                    class="form-control"
                    placeholder="example@email.com"
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label" for="signupPassword"
                    >Password</label
                  >

                  <div class="input-group">
                    <input
                      id="signupPassword"
                      type="password"
                      class="form-control"
                      placeholder="Minimum 6 characters"
                      aria-label="Password"
                      aria-describedby="toggleSignupPassword"
                    />

                    <button
                      class="btn btn-outline-secondary"
                      type="button"
                      id="toggleSignupPassword"
                      aria-label="Show or hide password"
                    >
                      👁️
                    </button>
                  </div>

                  <div class="text-danger small mt-1" id="signupError"></div>
                </div>

                <button class="btn btn-primary w-100 py-2" onclick="signup()">
                  <span id="signupText">Sign Up</span>
                  <span
                    id="signupSpinner"
                    class="spinner-border spinner-border-sm d-none"
                  ></span>
                </button>

                <div class="text-center mt-4 small">
                  Already have an account?
                  <a href="login.html" class="fw-semibold">Login</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script>
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
      }

      document
        .getElementById("togglePassword")
        ?.addEventListener("click", () => {
          togglePassword("password");
        });

      document
        .getElementById("toggleSignupPassword")
        ?.addEventListener("click", () => {
          togglePassword("signupPassword");
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auth Logic -->
    <script type="module" src="auth.js"></script>
  </body>
</html>
