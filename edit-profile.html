<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
  <span class="navbar-brand fw-bold">Edit Profile</span>
  <a href="index.html" class="btn btn-outline-light btn-sm">Back</a>
</nav>

<div class="container mt-4">
  <div class="card shadow p-4 mx-auto" style="max-width: 500px;">

    <div class="text-center mb-3">
      <img id="profilePreview" class="rounded-circle mb-2" width="120" height="120">
    </div>

    <div class="mb-3">
      <label class="form-label">Full Name</label>
      <input type="text" id="editFullName" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Date of Birth</label>
      <input type="date" id="editDOB" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Profile Picture</label>
      <input type="file" id="profileImage" class="form-control">
    </div>

    <button class="btn btn-primary w-100" onclick="updateProfile()">Save Changes</button>

  </div>
</div>

<script type="module" src="profile.js"></script>
</body>
</html>
