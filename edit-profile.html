<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Profile | Distributed Chat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
  <span class="navbar-brand fw-bold">Edit Profile</span>
  <a href="index.html" class="btn btn-outline-light btn-sm">Back</a>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm rounded-4 p-4">
        <h4 class="fw-bold mb-4 text-center">Update Your Profile</h4>

        <!-- PROFILE PHOTO -->
        <div class="text-center mb-4">
          <img
            id="profilePreview"
            src="default-avatar.png"
            class="rounded-circle mb-3"
            width="120"
            height="120"
          />

          <input
            type="file"
            id="profilePicInput"
            class="form-control"
            accept="image/*"
            onchange="previewProfilePic(event)"
          />
        </div>

        <!-- FULL NAME -->
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input id="fullName" class="form-control" />
        </div>

        <!-- DOB -->
        <div class="mb-4">
          <label class="form-label">Date of Birth</label>
          <input id="dob" type="date" class="form-control" />
        </div>

        <div class="text-danger small mb-3" id="profileError"></div>

        <button type="button" class="btn btn-primary w-100" onclick="saveProfile()">
  Save Changes
</button>

      </div>

    </div>
  </div>
</div>

<script type="module" src="profile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
